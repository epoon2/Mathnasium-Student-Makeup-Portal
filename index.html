<!DOCTYPE html>
<html>
<head>
    <title>Mathnasium Makeup Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 5px solid #e31837;
        }

        img {
            width: 180px;
            margin-bottom: 20px;
        }

        h2 {
            color: #333;
            margin-bottom: 1.5rem;
            font-size: 1.4rem;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #e31837;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #b3122b;
        }

        .backup-button {
            width: 100%;
            padding: 12px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }

        .backup-button:hover {
            background-color: #111;
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            line-height: 1.5;
        }

        .success {
            background-color: #e6f4ea;
            color: #137333;
            border: 1px solid #ceead6;
        }

        .error {
            background-color: #fce8e6;
            color: #c5221f;
            border: 1px solid #fad2cf;
        }

        .loading {
            background-color: #eef3fd;
            color: #174ea6;
            border: 1px solid #d2e3fc;
        }

        small {
            display: inline-block;
            margin-top: 6px;
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="https://www.mathnasium.com/themes/custom/mathnasium/logo.svg" alt="Mathnasium Logo">

        <h2>Student Makeup Portal</h2>

        <input type="text" id="name" placeholder="Student Full Name">
        <input type="text" id="parentName" placeholder="Parent Full Name on File">

        <button onclick="search()">Check Balance</button>

        <div id="result"></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2HSf_heyT8FNkh9pe9Kxnwxg3B3njUaX56fHYy1o-gynnIb82k2ySNZjsSKZSiZ0whQ/exec";

        function search() {
            const name = document.getElementById("name").value.trim();
            const parentName = document.getElementById("parentName").value.trim();
            const resultDiv = document.getElementById("result");

            if (!name || !parentName) {
                alert("Please enter both Student Name and Parent Full Name");
                return;
            }

            resultDiv.style.display = "block";
            resultDiv.className = "loading";
            resultDiv.innerHTML = "Checking records...";

            console.log("Starting search for:", name, parentName);

            const oldScript = document.getElementById("jsonp-script");
            if (oldScript) {
                oldScript.remove();
            }

            const script = document.createElement("script");
            script.id = "jsonp-script";

            script.src =
                SCRIPT_URL +
                "?name=" + encodeURIComponent(name) +
                "&parent=" + encodeURIComponent(parentName) +
                "&callback=onSuccess" +
                "&cacheBust=" + Date.now();

            script.onerror = function() {
                console.error("The Script URL failed to load. Showing Google sign-in fallback.");

                resultDiv.className = "error";
                resultDiv.innerHTML =
                    "Connection Error.<br>" +
                    "<small>Your browser or Google account may be blocking the automatic lookup.</small>" +
                    "<button class=\"backup-button\" onclick=\"manualFallback()\">" +
                    "Open Google Sign-In ↗" +
                    "</button>" +
                    "<small>After signing in, return to this tab and press Check Balance again.</small>";
            };

            document.body.appendChild(script);
        }

        function manualFallback() {
            window.open("https://accounts.google.com/AccountChooser", "_blank");

            const resultDiv = document.getElementById("result");
            resultDiv.className = "error";
            resultDiv.innerHTML =
                "A Google sign-in page opened in a new tab.<br>" +
                "<small>Choose your Google account there, then come back to this tab and press Check Balance again.</small>";
        }

        <script>
            function onSuccess(data) {
                const div = document.getElementById("result");
        
                const lastUpdatedText = data && data.lastUpdated
                    ? "<br><small>Last updated: " + data.lastUpdated + "</small>"
                    : "";
        
                if (data && !data.error && data.found !== false) {
                    div.className = "success";
                    div.innerHTML =
                        "<strong>" + data.name + "</strong><br>" +
                        "Makeup Sessions Available: <strong>" + data.makeups + "</strong>" +
                        lastUpdatedText;
                } else {
                    div.className = "error";
                    div.innerHTML =
                        "No record found.<br>" +
                        "<small>Check spelling. Use the parent full name on file.</small>" +
                        lastUpdatedText;
                }
            }
        </script>
    </script>
</body>
</html>
