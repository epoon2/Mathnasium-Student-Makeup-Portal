<!DOCTYPE html>
<html>
<head>
    <title>Mathnasium Makeup Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 5px solid #e31837;
        }

        img {
            width: 180px;
            margin-bottom: 20px;
        }

        h2 {
            color: #333;
            margin-bottom: 1.5rem;
            font-size: 1.4rem;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #e31837;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #b3122b;
        }

        .backup-button {
            width: 100%;
            padding: 12px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }

        .backup-button:hover {
            background-color: #111;
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            line-height: 1.5;
        }

        .success {
            background-color: #e6f4ea;
            color: #137333;
            border: 1px solid #ceead6;
        }

        .error {
            background-color: #fce8e6;
            color: #c5221f;
            border: 1px solid #fad2cf;
        }

        .loading {
            background-color: #eef3fd;
            color: #174ea6;
            border: 1px solid #d2e3fc;
        }

        small {
            display: inline-block;
            margin-top: 6px;
        }
        .dashboard {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }
        
        .dashboard-card {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            border-top: 5px solid #e31837;
        }
        
        .balance-box {
            background-color: #f4f7f6;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .balance-box p {
            margin: 0;
            color: #555;
        }
        
        .balance-box h1 {
            margin: 8px 0;
            font-size: 3rem;
            color: #e31837;
        }
        
        #dashboardMessage {
            margin-top: 20px;
            line-height: 1.5;
        }
        .history-section {
            margin-top: 18px;
            text-align: left;
        }
        
        .history-section h3 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }
        
        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            background: white;
            color: #333;
        }
        
        .history-table th,
        .history-table td {
            border: 1px solid #ddd;
            padding: 6px;
            text-align: left;
        }
        
        .history-table th {
            background-color: #f4f7f6;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="images/mathnasium-logo.png" alt="Mathnasium Logo">

        <h2>Student Makeup Portal</h2>

        <input type="text" id="name" placeholder="Student Full Name">
        <input type="text" id="parentName" placeholder="Parent Full Name on File">

        <button onclick="search()">Check Balance</button>

        <div id="result"></div>
    </div>

    <div id="dashboard" class="dashboard" style="display: none;">
        <div class="dashboard-card">
            <img src="images/mathnasium-logo.png" alt="Mathnasium Logo">

            <h2 id="dashboardStudentName">Student Dashboard</h2>

            <div class="balance-box">
                <p>Makeup Sessions Available</p>
                <h1 id="dashboardMakeups">0</h1>
                <small id="dashboardUnredeemedDates"></small>
                <small id="dashboardLastUpdated"></small>
            </div>

            <button onclick="showMakeupScheduling()">Schedule a Makeup Session</button>
            <button onclick="showScheduleChangeRequest()">Request a Schedule Change</button>
            <button onclick="showCurrentSchedule()">View Current Schedule</button>

            <button class="backup-button" onclick="logout()">Search Another Student</button>

            <div id="dashboardMessage"></div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2HSf_heyT8FNkh9pe9Kxnwxg3B3njUaX56fHYy1o-gynnIb82k2ySNZjsSKZSiZ0whQ/exec";

        function search() {
            const name = document.getElementById("name").value.trim();
            const parentName = document.getElementById("parentName").value.trim();
            const resultDiv = document.getElementById("result");

            if (!name || !parentName) {
                alert("Please enter both Student Name and Parent Full Name");
                return;
            }

            resultDiv.style.display = "block";
            resultDiv.className = "loading";
            resultDiv.innerHTML = "Checking records...";

            console.log("Starting search for:", name, parentName);

            const oldScript = document.getElementById("jsonp-script");
            if (oldScript) {
                oldScript.remove();
            }

            const script = document.createElement("script");
            script.id = "jsonp-script";

            script.src =
                SCRIPT_URL +
                "?name=" + encodeURIComponent(name) +
                "&parent=" + encodeURIComponent(parentName) +
                "&callback=onSuccess" +
                "&cacheBust=" + Date.now();

            script.onerror = function() {
                console.error("The Script URL failed to load.");
            
                resultDiv.className = "error";
                resultDiv.innerHTML =
                    "Connection Error.<br>" +
                    "<small>This may happen if your browser is signed into a work or school Google account.</small><br>" +
                    "<small>Please open this website in an Incognito or Private Browsing window, then try again.</small>";
            };

            document.body.appendChild(script);
        }
        
            function onSuccess(data) {
                const div = document.getElementById("result");
        
                const lastUpdatedText = data && data.lastUpdated
                    ? "<br><small>Last updated: " + data.lastUpdated + "</small>"
                    : "";
        
                if (data && !data.error && data.found !== false) {
                    showDashboard(data);
                } else {
                    div.className = "error";
                    div.innerHTML =
                        "No student found.<br>" +
                        "<small>Please check spelling and use the full names of the parent and student on file.</small><br>" +
                        "<small>Only students who have attended or have been scheduled in the last 2 months are shown in our system.</small>" +
                        lastUpdatedText;
                }
            }
            function showDashboard(data) {
                const loginCard = document.querySelector(".card");
                const dashboard = document.getElementById("dashboard");
            
                loginCard.style.display = "none";
                dashboard.style.display = "block";
            
                document.getElementById("dashboardStudentName").textContent =
                    data.name + "'s Dashboard";
            
                document.getElementById("dashboardMakeups").textContent =
                    data.makeups;
            
                document.getElementById("dashboardUnredeemedDates").innerHTML =
                    data.unredeemedDates
                        ? "Unredeemed dates: " + data.unredeemedDates
                        : "No unredeemed makeup dates listed.";
            
                document.getElementById("dashboardLastUpdated").innerHTML =
                    data.lastUpdated
                        ? "<br>Last updated: " + data.lastUpdated
                        : "";
            
                document.getElementById("dashboardMessage").innerHTML =
                    "<small>Current-month makeup balances are estimates based on attendance uploaded so far and remaining scheduled sessions. Final balances may update after the month ends.</small><br>" +
                    "<small>Scheduled makeup sessions are not deducted from the balance until the student attends.</small>" +
                    renderMakeupHistoryTable(data.makeupHistory);
            }
            
            function logout() {
                document.querySelector(".card").style.display = "block";
                document.getElementById("dashboard").style.display = "none";
            
                document.getElementById("result").style.display = "none";
                document.getElementById("result").innerHTML = "";
            
                document.getElementById("name").value = "";
                document.getElementById("parentName").value = "";
            }
            
            function showMakeupScheduling() {
                document.getElementById("dashboardMessage").innerHTML =
                    "<strong>Schedule a Makeup Session</strong><br>" +
                    "<small>This feature will be added soon.</small>";
            }
            
            function showScheduleChangeRequest() {
                document.getElementById("dashboardMessage").innerHTML =
                    "<strong>Request a Schedule Change</strong><br>" +
                    "<small>This feature will be added soon.</small>";
            }
            
            function showCurrentSchedule() {
                document.getElementById("dashboardMessage").innerHTML =
                    "<strong>Current Schedule</strong><br>" +
                    "<small>This feature will be added soon.</small>";
            }
            function renderMakeupHistoryTable(makeupHistoryJson) {
                let history = [];
            
                try {
                    history = JSON.parse(makeupHistoryJson || "[]");
                } catch (err) {
                    console.error("Could not parse makeup history:", err);
                    history = [];
                }
            
                if (!history.length) {
                    return "<br><small>No missed-session history found.</small>";
                }
            
                let html =
                    "<div class='history-section'>" +
                    "<h3>Makeup History</h3>" +
                    "<table class='history-table'>" +
                    "<thead>" +
                    "<tr>" +
                    "<th>Missed Date</th>" +
                    "<th>Day</th>" +
                    "<th>Status</th>" +
                    "<th>Redeemed On</th>" +
                    "<th>Expires</th>" +
                    "</tr>" +
                    "</thead>" +
                    "<tbody>";
            
                history.forEach(function(item) {
                    html +=
                        "<tr>" +
                        "<td>" + escapeHtml(item.missedDate || "") + "</td>" +
                        "<td>" + escapeHtml(item.day || "") + "</td>" +
                        "<td>" + escapeHtml(item.status || "") + "</td>" +
                        "<td>" + escapeHtml(item.redeemedOn || "-") + "</td>" +
                        "<td>" + escapeHtml(item.expiresOn || "-") + "</td>" +
                        "</tr>";
                });
            
                html +=
                    "</tbody>" +
                    "</table>" +
                    "</div>";
            
                return html;
            }
            
            function escapeHtml(value) {
                return String(value || "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }
    </script>
</body>
</html>
